<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Поза по референсу</title>
<style>
:root{box-sizing:border-box;--bg:#f4f1ec;--fg:#1c1a17;--panel:rgba(255,255,255,.94);--accent:#c4452d;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f4f1ec;--panel:rgba(30,28,26,.94);--accent:#ff7a5c}}
:root[data-theme="dark"]{--bg:#111;--fg:#f4f1ec;--panel:rgba(30,28,26,.94);--accent:#ff7a5c}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;touch-action:none}
video,#ref{position:absolute;inset:0;width:100%;height:100%}
video{object-fit:cover}
#ref{object-fit:contain;opacity:.45;pointer-events:none;display:none}
.hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px;font-size:16px;line-height:1.4}
.panel{background:var(--panel);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
button,label.btn{flex:1;border:0;border-radius:12px;padding:11px 6px;font-size:14px;font-weight:600;background:var(--fg);color:var(--bg);text-align:center;cursor:pointer}
button.main{background:var(--accent);color:#fff}
button.pin{background:#e60023;color:#fff}
button.ghost,label.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
input[type=range]{flex:1;accent-color:var(--accent)}
small{opacity:.7;min-width:92px}
input[type=file]{display:none}
.start{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.start h1{font-size:26px;margin:0 0 4px;line-height:1.15}
.start p{margin:0 0 8px;opacity:.75;font-size:15px;line-height:1.4}
.start button,.start label.btn{flex:none;padding:15px 10px;font-size:16px}
#sinfo{font-size:14px;opacity:.85;min-height:60px;line-height:1.4}
#sChange{flex:none;background:none;color:var(--fg);opacity:.6;font-size:13px;font-weight:400;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;gap:10px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}
.modal img{flex:1;min-height:0;width:100%;object-fit:contain}
.modal .tip{color:#fff;text-align:center;font-size:13px;opacity:.8}
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <img id="ref" alt="">
  <div class="hint" id="hint"></div>
</div>
<div class="panel">
  <div class="row"><small>Прозрачность</small><input type="range" id="op" min="10" max="90" value="45"></div>
  <div class="row"><small>Масштаб</small><input type="range" id="zr" min="1" max="5" step="0.05" value="1"></div>
  <div class="row">
    <button class="pin" id="pin">Pinterest</button>
    <label class="btn ghost" for="file">Из галереи</label>
    <input type="file" id="file" accept="image/*">
  </div>
  <div class="row">
    <button class="ghost" id="flip">Фронт/Тыл</button>
    <button class="ghost" id="mir">Зеркало</button>
    <button class="main" id="shot">Снять</button>
  </div>
</div>
<div class="start" id="startScreen">
  <h1>Поза по референсу</h1>
  <p>Выберите фото-референс, и камера включится сама с полупрозрачной подсказкой.</p>
  <button class="pin" id="sPin">Открыть Pinterest</button>
  <label class="btn ghost" for="file">Выбрать из галереи</label>
  <div id="sinfo">В Pinterest откройте пин, нажмите «⋯» и выберите «Скачать изображение». Вернитесь сюда и выберите это фото из галереи.</div>
  <button id="sChange">Сменить ник или ссылку на доску</button>
</div>
<div class="modal" id="modal">
  <img id="result" alt="">
  <div class="tip" id="tip">Нажмите «Сохранить в Фото» и выберите «Сохранить изображение»</div>
  <div class="row">
    <button class="main" id="save">Сохранить в Фото</button>
    <button class="ghost" id="close" style="color:#fff;border-color:#fff">Закрыть</button>
  </div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var cam=$('cam'),ref=$('ref'),hint=$('hint'),modal=$('modal'),result=$('result'),stage=$('stage'),zr=$('zr');
  var facing='user',stream=null,track=null,mirrored=false,shotFile=null,pinOpened=false;
  var z=1,zmin=1,zmax=5,hw=false,starting=false;

  function tf(){
    cam.style.transform=(facing==='user'?'scaleX(-1) ':'')+(hw?'':'scale('+z+')');
    ref.style.transform=mirrored?'scaleX(-1)':'none';
  }
  function setZoom(v){
    z=Math.min(zmax,Math.max(zmin,v));zr.value=z;
    if(hw&&track){track.applyConstraints({advanced:[{zoom:z}]}).catch(function(){});}
    tf();
  }
  async function startCam(){
    if(starting)return;starting=true;
    try{
      if(stream){stream.getTracks().forEach(function(t){t.stop();});}
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});
      cam.srcObject=stream;track=stream.getVideoTracks()[0];
      var c=(track.getCapabilities&&track.getCapabilities())||{};
      hw=!!(c.zoom&&c.zoom.max>c.zoom.min);
      zmin=hw?c.zoom.min:1;zmax=hw?Math.min(c.zoom.max,10):5;
      zr.min=zmin;zr.max=zmax;
      setZoom(zmin);
      hint.style.display='none';
    }catch(e){
      hint.style.display='flex';
      hint.textContent='Камера не включилась. Нажмите сюда и разрешите доступ к камере для этого сайта.';
    }
    starting=false;
  }
  hint.onclick=startCam;
  function setRef(src){
    ref.onload=function(){
      ref.style.display='block';
      $('startScreen').style.display='none';
      if(!stream){startCam();}
    };
    ref.src=src;
  }

  $('file').onchange=function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    startCam();
    setRef(URL.createObjectURL(f));
  };
  $('flip').onclick=function(){facing=facing==='user'?'environment':'user';startCam();};
  $('mir').onclick=function(){mirrored=!mirrored;tf();};
  $('op').oninput=function(e){ref.style.opacity=e.target.value/100;};
  zr.oninput=function(){setZoom(parseFloat(zr.value));};

  // Щипок двумя пальцами: приблизить / отдалить
  var d0=0,z0=1;
  function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
  stage.addEventListener('touchstart',function(e){if(e.touches.length===2){d0=dist(e.touches);z0=z;}},{passive:true});
  stage.addEventListener('touchmove',function(e){if(e.touches.length===2&&d0){e.preventDefault();setZoom(z0*dist(e.touches)/d0);}},{passive:false});
  stage.addEventListener('touchend',function(){d0=0;});

  // Pinterest: ник или ссылка на доску (запоминается в браузере)
  function pinUrl(ask){
    var v=null;try{v=localStorage.getItem('pinNick');}catch(e){}
    if(v===null||ask){
      v=prompt('Ваш ник в Pinterest или ссылка на доску. Можно оставить пустым:')||'';
      v=v.trim().replace(/^@/,'');
      try{localStorage.setItem('pinNick',v);}catch(e){}
    }
    if(/^https?:\/\//i.test(v))return v;
    return 'https://www.pinterest.com/'+(v?encodeURIComponent(v)+'/':'');
  }
  function openPin(){
    pinOpened=true;
    window.open(pinUrl(false),'_blank');
    if($('startScreen').style.display==='none'){
      alert('В Pinterest откройте пин, нажмите «⋯» и «Скачать изображение». Затем вернитесь и выберите фото через «Из галереи».');
    }
  }
  $('pin').onclick=openPin;$('sPin').onclick=openPin;
  $('sChange').onclick=function(){pinUrl(true);};
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&pinOpened&&$('startScreen').style.display!=='none'){
      $('sinfo').textContent='Вернулись из Pinterest? Нажмите «Выбрать из галереи» и выберите последнее скачанное фото.';
    }
  });

  // Съёмка: сохраняется ровно то, что видно на экране, с учётом масштаба
  $('shot').onclick=function(){
    if(!stream||!cam.videoWidth){return;}
    var vw=cam.videoWidth,vh=cam.videoHeight,W=stage.clientWidth,H=stage.clientHeight;
    var s=Math.max(W/vw,H/vh),zz=hw?1:z;
    var sw=W/(s*zz),sh=H/(s*zz),sx=(vw-sw)/2,sy=(vh-sh)/2;
    var c=document.createElement('canvas');c.width=Math.round(sw);c.height=Math.round(sh);
    var x=c.getContext('2d');
    if(facing==='user'){x.translate(c.width,0);x.scale(-1,1);}
    x.drawImage(cam,sx,sy,sw,sh,0,0,c.width,c.height);
    c.toBlob(function(b){
      shotFile=new File([b],'pose-'+Date.now()+'.jpg',{type:'image/jpeg'});
      result.src=URL.createObjectURL(b);
      modal.style.display='flex';
    },'image/jpeg',.95);
  };
  $('save').onclick=async function(){
    if(!shotFile)return;
    try{
      if(navigator.canShare&&navigator.canShare({files:[shotFile]})){await navigator.share({files:[shotFile]});return;}
    }catch(e){if(e&&e.name==='AbortError'){return;}}
    $('tip').textContent='Удерживайте фото пальцем и выберите «Добавить в Фото».';
  };
  $('close').onclick=function(){modal.style.display='none';};
})();
</script>
</body>
</html>
